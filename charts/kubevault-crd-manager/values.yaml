# Docker registry fqdn used to pull app related images.
# Set this to use docker registry hosted at ${registryFQDN}/${registry}/${image}
registryFQDN: ghcr.io

# Docker registry containing app images
image:
  # Docker registry used to pull app container image
  registry: kubevault
  # App container image
  repository: kubevault-crd-manager
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Specify an array of imagePullSecrets.
# Secrets must be manually created in the namespace.
#
# Example:
# helm template charts/kubevault-crd-manager \
#   --set imagePullSecrets[0].name=sec0 \
#   --set imagePullSecrets[1].name=sec1
imagePullSecrets: []
# Container image pull policy
imagePullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

# Security options this container should run with
securityContext: # +doc-gen:break
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # readOnlyRootFilesystem: true
  runAsNonRoot: true
  # runAsUser: 101
  seccompProfile:
    type: RuntimeDefault

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

ttlSecondsAfterFinished: 120

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

# featureGates controls which database secret engine Role CRDs are
# installed. AWS, Azure, GCP, and PKI are not database plugins and are
# always installed regardless of these settings.
featureGates:
  DB2: false
  Druid: false
  Elasticsearch: false
  HanaDB: false
  Hazelcast: false
  Ignite: false
  Kafka: false
  MariaDB: false
  Memcached: false
  Milvus: false
  MongoDB: false
  MSSQLServer: false
  MySQL: false
  Neo4j: false
  Oracle: false
  Postgres: false
  Qdrant: false
  RabbitMQ: false
  Redis: false
  Solr: false
  Weaviate: false
  ZooKeeper: false

# If true, removes the Role CRD of any database engine whose feature gate
# above is false, as long as no live objects of that kind remain.
removeUnusedCRDs: false

distro:
  openshift: false
  ubi: ""
