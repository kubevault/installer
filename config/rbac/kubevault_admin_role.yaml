# This rule is not used by the project kubevault-installer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over installer.kubevault.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubevault-installer
    app.kubernetes.io/managed-by: kustomize
  name: kubevault-admin-role
rules:
- apiGroups:
  - installer.kubevault.com
  resources:
  - kubevaults
  verbs:
  - '*'
- apiGroups:
  - installer.kubevault.com
  resources:
  - kubevaults/status
  verbs:
  - get
