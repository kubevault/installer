apiVersion: installer.kubevault.com/v1
kind: Kubevault
metadata:
  name: kubevault-sample
spec:
  nameOverride: ''
  fullnameOverride: ''
  global:
    license: ''
    licenseSecretName: ''
    registry: ''
    registryFQDN: ''
    imagePullSecrets: []
    monitoring:
      agent: prometheus.io
      serviceMonitor:
        labels: {}
    distro:
      openshift: false
      ubi: all
    featureGates:
      Druid: false
      Elasticsearch: false
      Etcd: false
      HanaDB: false
      Ignite: false
      Kafka: false
      MariaDB: false
      Milvus: false
      MongoDB: false
      MSSQLServer: false
      MySQL: true
      Neo4j: false
      Oracle: false
      Postgres: true
      Qdrant: false
      RabbitMQ: false
      Redis: false
      Solr: false
      Weaviate: false
  kubevault-crd-manager:
    enabled: true
    registryFQDN: ghcr.io
    image:
      registry: kubevault
      repository: kubevault-crd-manager
      tag: ''
    imagePullSecrets: []
    imagePullPolicy: IfNotPresent
    nameOverride: ''
    fullnameOverride: ''
    podAnnotations: {}
    podSecurityContext: {}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    ttlSecondsAfterFinished: 120
    serviceAccount:
      create: true
      annotations: {}
      name: null
    featureGates:
      Druid: false
      Elasticsearch: false
      Etcd: false
      HanaDB: false
      Ignite: false
      Kafka: false
      MariaDB: false
      Milvus: false
      MongoDB: false
      MSSQLServer: false
      MySQL: true
      Neo4j: false
      Oracle: false
      Postgres: true
      Qdrant: false
      RabbitMQ: false
      Redis: false
      Solr: false
      Weaviate: false
    removeUnusedCRDs: false
    distro:
      openshift: false
      ubi: all
  kubevault-catalog:
    enabled: true
    nameOverride: ''
    fullnameOverride: ''
    proxies:
      dockerHub: docker.io
      dockerLibrary: docker.io/library
      ghcr: ghcr.io
      quay: quay.io
      kubernetes: registry.k8s.io
      microsoft: mcr.microsoft.com
      appscode: r.appscode.com
      oracle: container-registry.oracle.com
      weaviate: cr.weaviate.io
    skipDeprecated: true
    distro:
      openshift: false
      ubi: all
  kubevault-operator:
    enabled: true
    nameOverride: ''
    fullnameOverride: ''
    replicaCount: 1
    license: ''
    licenseSecretName: ''
    registryFQDN: ghcr.io
    operator:
      registry: kubevault
      repository: vault-operator
      tag: ''
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      resources: {}
    registerCRDs: false
    featureGates:
      Druid: false
      Elasticsearch: false
      Etcd: false
      HanaDB: false
      Ignite: false
      Kafka: false
      MariaDB: false
      Milvus: false
      MongoDB: false
      MSSQLServer: false
      MySQL: true
      Neo4j: false
      Oracle: false
      Postgres: true
      Qdrant: false
      RabbitMQ: false
      Redis: false
      Solr: false
      Weaviate: false
    imagePullSecrets: []
    imagePullPolicy: IfNotPresent
    criticalAddon: false
    priorityClassName: ''
    logLevel: 3
    annotations: {}
    podAnnotations: {}
    nodeSelector:
      kubernetes.io/os: linux
    tolerations: []
    affinity: {}
    podSecurityContext: {}
    serviceAccount:
      create: true
      annotations: {}
      name: ''
    apiserver:
      useKubeapiserverFqdnForAks: true
      healthcheck:
        enabled: true
        probePort: 8081
    monitoring:
      bindPort: 8080
      agent: prometheus.io
      serviceMonitor:
        labels: {}
    clusterName: ''
    recommendationEngine:
      recommendationResyncPeriod: 1h0m0s
      genRotateTLSRecommendationBeforeExpiryYear: 0
      genRotateTLSRecommendationBeforeExpiryMonth: 1
      genRotateTLSRecommendationBeforeExpiryDay: 0
    tenantIsolation:
      maxSpokeNamespaces: 256
      maxNamespaceSliceShards: 32
    distro:
      openshift: false
      ubi: all
  kubevault-webhook-server:
    enabled: true
    nameOverride: ''
    fullnameOverride: ''
    replicaCount: 1
    registryFQDN: ghcr.io
    server:
      registry: kubevault
      repository: vault-operator
      tag: ''
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      resources: {}
    imagePullSecrets: []
    imagePullPolicy: IfNotPresent
    criticalAddon: false
    priorityClassName: ''
    logLevel: 3
    featureGates:
      Druid: false
      Elasticsearch: false
      Etcd: false
      HanaDB: false
      Ignite: false
      Kafka: false
      MariaDB: false
      Milvus: false
      MongoDB: false
      MSSQLServer: false
      MySQL: true
      Neo4j: false
      Oracle: false
      Postgres: true
      Qdrant: false
      RabbitMQ: false
      Redis: false
      Solr: false
      Weaviate: false
    annotations: {}
    podAnnotations: {}
    nodeSelector:
      kubernetes.io/os: linux
    tolerations: []
    affinity: {}
    podSecurityContext: {}
    serviceAccount:
      create: true
      annotations: {}
      name: ''
    apiserver:
      enableMutatingWebhook: true
      enableValidatingWebhook: true
      ca: not-ca-cert
      healthcheck:
        enabled: false
        probePort: 8081
      port: 9443
      servingCerts:
        generate: true
        certManager:
          enabled: false
          issuerRef:
            name: ''
            kind: Issuer
            group: cert-manager.io
        caCrt: ''
        serverCrt: ''
        serverKey: ''
      webhook:
        failurePolicy: Ignore
    monitoring:
      agent: prometheus.io
      bindPort: 8080
      serviceMonitor:
        labels: {}
    distro:
      openshift: false
      ubi: all
    kubectl:
      registry: appscode
      repository: kubectl-nonroot
      tag: '1.34'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      resources: {}
  ace-user-roles:
    enabled: true
    enableClusterRoles:
      ace: false
      appcatalog: true
      audit: true
      catalog: false
      cert-manager: false
      kubedb-ui: false
      kubedb: false
      kubestash: false
      kubevault: true
      license-proxyserver: true
      metrics: false
      prometheus: false
      secrets-store: false
      stash: false
      virtual-secrets: false
  registryFQDN: ghcr.io
  tester:
    registry: appscode
    repository: kubectl-nonroot
    tag: '1.34'
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    resources: {}
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  podLabels: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
